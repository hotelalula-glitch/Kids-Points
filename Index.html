<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نظام متابعة المهام والمكافآت</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #18202c;
    --muted: #5f6c7b;
    --primary: #0f766e;
    --primary-dark: #115e59;
    --accent: #d97706;
    --danger: #b91c1c;
    --border: #e2e8f0;
    --success-bg: #ecfdf5;
    --success-text: #065f46;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 14px;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
  }
  .topbar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    margin-bottom: 14px;
  }
  .topbar-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  h1 {
    margin: 0;
    font-size: 1.25rem;
  }
  .subtitle {
    margin: 4px 0 0;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  button:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #e2e8f0; color: var(--text); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-small { padding: 6px 10px; font-size: 0.82rem; border-radius: 8px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
  }
  .child-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .child-name { font-size: 1.1rem; font-weight: 700; margin: 0; }
  .child-age { font-size: 0.82rem; color: var(--muted); }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .stat-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    text-align: center;
  }
  .stat-label { font-size: 0.78rem; color: var(--muted); display: block; }
  .stat-val { font-size: 1rem; font-weight: 700; color: var(--primary-dark); }
  .progress-wrap {
    background: #e2e8f0;
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.25s ease;
  }
  .task-list {
    list-style: none;
    padding: 0;
    margin: 0 0 10px;
  }
  .task-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 0.9rem;
  }
  .task-item:last-child { border-bottom: none; }
  .badge {
    font-size: 0.78rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--success-bg);
    color: var(--success-text);
    font-weight: 700;
    white-space: nowrap;
  }
  .note {
    font-size: 0.8rem;
    color: var(--muted);
    background: #fffbeb;
    border: 1px solid #fde68a;
    padding: 8px 10px;
    border-radius: 10px;
    margin-top: 8px;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-top: 14px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }
  .hidden { display: none !important; }
  .form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  input, select {
    padding: 9px 11px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 0.92rem;
    background: #fff;
    color: var(--text);
  }
  input[type="text"], input[type="number"] { flex: 1; min-width: 130px; }
  .msg {
    margin-top: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .msg-ok { background: var(--success-bg); color: var(--success-text); }
  .msg-err { background: #fef2f2; color: var(--danger); }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="topbar-head">
      <div>
        <h1>نظام متابعة المهام والمكافآت</h1>
        <p class="subtitle">١٠ نقاط = ١ ريال • الحد الأقصى اليومي ٣٠ نقطة (٣ ريال) لكل ابن</p>
      </div>
      <span id="todayLabel" class="badge"></span>
    </div>

    <div class="btn-row">
      <button type="button" class="btn-secondary" id="btnAllView">عرض الكل</button>
      <button type="button" class="btn-primary" id="btnOpenParent">لوحة الأب (رمز 1234)</button>
      <button type="button" class="btn-secondary" id="btnResetDay">تصفير نقاط اليوم</button>
    </div>
    <div id="globalMsg" class="msg hidden"></div>
  </div>

  <!-- شاشة إدخال رمز لوحة الأب -->
  <div id="pinBox" class="panel hidden">
    <h2 style="margin:0 0 6px; font-size:1.05rem;">الدخول إلى لوحة الأب</h2>
    <p style="margin:0; font-size:0.88rem; color:var(--muted);">أدخل رمز لوحة الأب (الافتراضي: 1234)</p>
    <div class="form-row">
      <input type="password" id="pinInput" placeholder="أدخل الرمز 1234" inputmode="numeric" />
      <button type="button" class="btn-primary" id="btnVerifyPin">دخول</button>
      <button type="button" class="btn-secondary" id="btnCancelPin">إلغاء</button>
    </div>
    <div id="pinMsg" class="msg hidden"></div>
  </div>

  <!-- لوحة الأب -->
  <div id="parentPanel" class="panel hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
      <h2 style="margin:0; font-size:1.1rem;">لوحة تحكم الأب</h2>
      <button type="button" class="btn-secondary btn-small" id="btnLockParent">إغلاق اللوحة</button>
    </div>

    <p style="margin:8px 0 4px; font-size:0.9rem; font-weight:700;">إضافة مهمة جديدة لابن:</p>
    <div class="form-row">
      <select id="taskChildSelect"></select>
      <input type="text" id="taskTitleInput" placeholder="اسم المهمة (مثال: ترتيب السرير)" />
      <input type="number" id="taskPtsInput" placeholder="النقاط" min="1" max="30" value="10" style="max-width:95px;" />
      <button type="button" class="btn-accent" id="btnAddTask">إضافة مهمة</button>
    </div>

    <p style="margin:14px 0 4px; font-size:0.9rem; font-weight:700;">تعديل نقاط اليوم أو صرف رصيد:</p>
    <div class="form-row">
      <select id="adjustChildSelect"></select>
      <input type="number" id="adjustPtsInput" placeholder="نقاط (+/-)" value="10" style="max-width:110px;" />
      <button type="button" class="btn-primary btn-small" id="btnAddManualPts">إضافة نقاط</button>
      <button type="button" class="btn-secondary btn-small" id="btnSubManualPts">خصم نقاط</button>
      <button type="button" class="btn-danger btn-small" id="btnRedeemAll">صرف الرصيد وتحويله لريال</button>
    </div>

    <p style="margin:14px 0 4px; font-size:0.9rem; font-weight:700;">تغيير رمز لوحة الأب:</p>
    <div class="form-row">
      <input type="text" id="newPinInput" placeholder="رمز جديد (4 أرقام)" inputmode="numeric" style="max-width:160px;" />
      <button type="button" class="btn-secondary btn-small" id="btnSavePin">حفظ الرمز</button>
    </div>
    <div id="parentMsg" class="msg hidden"></div>
  </div>

  <!-- بطاقات الأبناء -->
  <div id="childrenGrid" class="grid"></div>
</div>

<script>
(function () {
  const DAILY_CAP = 30;
  const PTS_PER_SAR = 10;
  const STORAGE_KEY = "family_tasks_rewards_v1";

  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function defaultState() {
    return {
      pin: "1234",
      lastDay: todayKey(),
      children: [
        {
          id: "abdullah",
          name: "عبدالله",
          age: 15,
          dailyPts: 0,
          savedPts: 0,
          note: "",
          tasks: [
            { id: "t1", title: "الصلاة في وقتها", pts: 10 },
            { id: "t2", title: "ترتيب الغرفة والمذاكرة", pts: 10 }
          ]
        },
        {
          id: "abdrabbo",
          name: "عبدربه",
          age: 10,
          dailyPts: 0,
          savedPts: 0,
          note: "",
          tasks: [
            { id: "t3", title: "ترتيب الملابس والأغراض", pts: 10 },
            { id: "t4", title: "المساعدة في المنزل", pts: 10 }
          ]
        },
        {
          id: "rancy",
          name: "رانسي",
          age: 8,
          dailyPts: 0,
          savedPts: 0,
          note: "",
          tasks: [
            { id: "t5", title: "ترتيب الألعاب والكتب", pts: 10 },
            { id: "t6", title: "الالتزام بالواجبات", pts: 10 }
          ]
        },
        {
          id: "reef",
          name: "ريف",
          age: 5,
          dailyPts: 0,
          savedPts: 0,
          note: "متابعة السكر من النوع الأول والالتزام بالوجبات والقياس",
          tasks: [
            { id: "t7", title: "التعاون في قياس السكر والوجبة", pts: 10 },
            { id: "t8", title: "ترتيب الألعاب", pts: 10 }
          ]
        }
      ]
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed.children)) return defaultState();
      if (parsed.lastDay !== todayKey()) {
        parsed.children.forEach(c => { c.dailyPts = 0; });
        parsed.lastDay = todayKey();
      }
      return parsed;
    } catch (_) {
      return defaultState();
    }
  }

  let state = loadState();
  let isParentUnlocked = false;
  let selectedChildId = null;

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (_) {}
  }

  function showMsg(el, text, isError) {
    if (!el) return;
    el.textContent = text;
    el.className = "msg " + (isError ? "msg-err" : "msg-ok");
    el.classList.remove("hidden");
  }

  function hideMsg(el) {
    if (!el) return;
    el.classList.add("hidden");
  }

  function awardPoints(childId, ptsToAdd) {
    const child = state.children.find(c => c.id === childId);
    if (!child) return;
    const addNum = Number(ptsToAdd) || 0;
    if (addNum <= 0) return;

    const remainingCap = Math.max(0, DAILY_CAP - child.dailyPts);
    if (remainingCap === 0) {
      showMsg(document.getElementById("globalMsg"), `${child.name} وصل للحد اليومي (٣٠ نقطة).`, true);
      return;
    }

    const actualAdd = Math.min(addNum, remainingCap);
    child.dailyPts += actualAdd;
    child.savedPts += actualAdd;
    saveState();
    render();
    showMsg(
      document.getElementById("globalMsg"),
      `تمت إضافة ${actualAdd} نقطة لـ ${child.name} (رصيده التراكمي: ${child.savedPts} نقطة = ${(child.savedPts / PTS_PER_SAR).toFixed(1)} ريال).`,
      false
    );
  }

  function adjustPointsManual(childId, delta) {
    const child = state.children.find(c => c.id === childId);
    const parentMsg = document.getElementById("parentMsg");
    if (!child) return;

    if (delta > 0) {
      const remainingCap = Math.max(0, DAILY_CAP - child.dailyPts);
      const actual = Math.min(delta, remainingCap);
      child.dailyPts += actual;
      child.savedPts += actual;
      saveState();
      render();
      showMsg(parentMsg, `أضيفت ${actual} نقطة لـ ${child.name} (الحد اليومي ٣٠ نقطة).`, false);
    } else if (delta < 0) {
      const sub = Math.abs(delta);
      child.dailyPts = Math.max(0, child.dailyPts - sub);
      child.savedPts = Math.max(0, child.savedPts - sub);
      saveState();
      render();
      showMsg(parentMsg, `تم خصم ${sub} نقطة من ${child.name}.`, false);
    }
  }

  function redeemChildPoints(childId) {
    const child = state.children.find(c => c.id === childId);
    const parentMsg = document.getElementById("parentMsg");
    if (!child) return;
    const sar = (child.savedPts / PTS_PER_SAR).toFixed(2);
    const oldPts = child.savedPts;
    child.savedPts = 0;
    saveState();
    render();
    showMsg(parentMsg, `تم صرف ${oldPts} نقطة لـ ${child.name} بقيمة ${sar} ريال.`, false);
  }

  function populateSelects() {
    const s1 = document.getElementById("taskChildSelect");
    const s2 = document.getElementById("adjustChildSelect");
    const prev1 = s1.value;
    const prev2 = s2.value;
    const optionsHtml = state.children
      .map(c => `<option value="${c.id}">${c.name} (${c.age} سنوات)</option>`)
      .join("");
    s1.innerHTML = optionsHtml;
    s2.innerHTML = optionsHtml;
    if (prev1) s1.value = prev1;
    if (prev2) s2.value = prev2;
  }

  function render() {
    document.getElementById("todayLabel").textContent = `التاريخ: ${todayKey()}`;
    populateSelects();

    const parentPanel = document.getElementById("parentPanel");
    if (isParentUnlocked) {
      parentPanel.classList.remove("hidden");
    } else {
      parentPanel.classList.add("hidden");
    }

    const grid = document.getElementById("childrenGrid");
    const listToShow = selectedChildId
      ? state.children.filter(c => c.id === selectedChildId)
      : state.children;

    grid.innerHTML = listToShow.map(child => {
      const pct = Math.min(100, Math.round((child.dailyPts / DAILY_CAP) * 100));
      const sarBalance = (child.savedPts / PTS_PER_SAR).toFixed(1);
      const tasksHtml = child.tasks.map(t => `
        <li class="task-item">
          <span>${t.title}</span>
          <button type="button" class="btn-primary btn-small" data-award-child="${child.id}" data-award-pts="${t.pts}">+${t.pts} نقطة</button>
        </li>
      `).join("");

      const noteHtml = child.note ? `<div class="note">${child.note}</div>` : "";

      return `
        <div class="card">
          <div class="child-header">
            <h3 class="child-name">${child.name}</h3>
            <span class="child-age">${child.age} سنوات</span>
          </div>
          <div class="stats">
            <div class="stat-box">
              <span class="stat-label">نقاط اليوم (حد ٣٠)</span>
              <span class="stat-val">${child.dailyPts} / ${DAILY_CAP}</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">الرصيد التراكمي</span>
              <span class="stat-val">${child.savedPts} ن (${sarBalance} ر.س)</span>
            </div>
          </div>
          <div class="progress-wrap">
            <div class="progress-bar" style="width:${pct}%"></div>
          </div>
          <ul class="task-list">${tasksHtml}</ul>
          <div class="btn-row" style="margin-top:6px;">
            <button type="button" class="btn-secondary btn-small" data-focus-child="${child.id}">عرض هذا الابن فقط</button>
          </div>
          ${noteHtml}
        </div>
      `;
    }).join("");
  }

  // ربط الأحداث
  document.getElementById("btnAllView").addEventListener("click", () => {
    selectedChildId = null;
    hideMsg(document.getElementById("globalMsg"));
    render();
  });

  document.getElementById("btnOpenParent").addEventListener("click", () => {
    hideMsg(document.getElementById("globalMsg"));
    if (isParentUnlocked) {
      document.getElementById("parentPanel").classList.remove("hidden");
      return;
    }
    document.getElementById("pinBox").classList.remove("hidden");
    document.getElementById("pinInput").value = "";
    document.getElementById("pinInput").focus();
  });

  document.getElementById("btnCancelPin").addEventListener("click", () => {
    document.getElementById("pinBox").classList.add("hidden");
    hideMsg(document.getElementById("pinMsg"));
  });

  document.getElementById("btnVerifyPin").addEventListener("click", () => {
    const entered = (document.getElementById("pinInput").value || "").trim();
    if (entered === state.pin) {
      isParentUnlocked = true;
      document.getElementById("pinBox").classList.add("hidden");
      hideMsg(document.getElementById("pinMsg"));
      render();
      showMsg(document.getElementById("parentMsg"), "تم فتح لوحة تحكم الأب بنجاح.", false);
    } else {
      showMsg(document.getElementById("pinMsg"), "الرمز غير صحيح. الرمز الافتراضي هو 1234", true);
    }
  });

  document.getElementById("btnLockParent").addEventListener("click", () => {
    isParentUnlocked = false;
    render();
  });

  document.getElementById("btnAddTask").addEventListener("click", () => {
    const cid = document.getElementById("taskChildSelect").value;
    const title = (document.getElementById("taskTitleInput").value || "").trim();
    const pts = Math.max(1, Math.min(30, Number(document.getElementById("taskPtsInput").value) || 10));
    const child = state.children.find(c => c.id === cid);
    if (!child || !title) {
      showMsg(document.getElementById("parentMsg"), "اكتب اسم المهمة أولاً.", true);
      return;
    }
    child.tasks.push({ id: "t_" + Date.now(), title, pts });
    document.getElementById("taskTitleInput").value = "";
    saveState();
    render();
    showMsg(document.getElementById("parentMsg"), `تمت إضافة مهمة "${title}" لـ ${child.name}.`, false);
  });

  document.getElementById("btnAddManualPts").addEventListener("click", () => {
    const cid = document.getElementById("adjustChildSelect").value;
    const val = Math.abs(Number(document.getElementById("adjustPtsInput").value) || 0);
    adjustPointsManual(cid, val);
  });

  document.getElementById("btnSubManualPts").addEventListener("click", () => {
    const cid = document.getElementById("adjustChildSelect").value;
    const val = Math.abs(Number(document.getElementById("adjustPtsInput").value) || 0);
    adjustPointsManual(cid, -val);
  });

  document.getElementById("btnRedeemAll").addEventListener("click", () => {
    const cid = document.getElementById("adjustChildSelect").value;
    redeemChildPoints(cid);
  });

  document.getElementById("btnSavePin").addEventListener("click", () => {
    const np = (document.getElementById("newPinInput").value || "").trim();
    if (np.length < 4) {
      showMsg(document.getElementById("parentMsg"), "أدخل رمزاً من ٤ أرقام على الأقل.", true);
      return;
    }
    state.pin = np;
    document.getElementById("newPinInput").value = "";
    saveState();
    showMsg(document.getElementById("parentMsg"), "تم تحديث رمز لوحة الأب.", false);
  });

  document.getElementById("btnResetDay").addEventListener("click", () => {
    state.children.forEach(c => { c.dailyPts = 0; });
    state.lastDay = todayKey();
    saveState();
    render();
    showMsg(document.getElementById("globalMsg"), "تم تصفير نقاط اليوم لجميع الأبناء مع بقاء الرصيد التراكمي.", false);
  });

  document.getElementById("childrenGrid").addEventListener("click", (e) => {
    const awardBtn = e.target.closest("[data-award-child]");
    if (awardBtn) {
      awardPoints(awardBtn.getAttribute("data-award-child"), awardBtn.getAttribute("data-award-pts"));
      return;
    }
    const focusBtn = e.target.closest("[data-focus-child]");
    if (focusBtn) {
      selectedChildId = focusBtn.getAttribute("data-focus-child");
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
